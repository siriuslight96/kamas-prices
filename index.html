<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prix des Kamas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1B1A17">
<style>
  :root {
    --ink: #1B1A17; --ink-soft: #242220; --paper: #F6F1E4; --paper-dim: #EAE2CC;
    --brass: #C89B3C; --brass-bright: #E3B94D; --teal: #3D6B66; --teal-bright: #5A9691;
    --line: #3A3730;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--paper); margin: 0;
    font-family: Georgia, 'Iowan Old Style', serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header { padding: 28px 20px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 24px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .sub { margin: 6px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: var(--paper-dim); opacity: 0.7; }
  main { padding: 20px; max-width: 560px; margin: 0 auto; }
  select {
    width: 100%; background: var(--ink-soft); color: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    font-size: 16px; margin-bottom: 20px; font-family: system-ui, sans-serif;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--ink-soft); border: 1px solid var(--line); border-radius: 10px;
    padding: 15px 16px; margin-bottom: 10px; text-decoration: none; color: var(--paper);
  }
  .row.best { border-color: var(--brass); }
  .row.closed { opacity: 0.6; }
  .site-name { color: var(--teal-bright); font-family: system-ui, sans-serif; font-size: 14px; }
  .badge { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.open { background: rgba(90,150,145,0.18); color: var(--teal-bright); }
  .badge.closed { background: rgba(165,71,58,0.18); color: #E8A79B; }
  .badge.unknown { background: rgba(180,150,80,0.16); color: #a56b00; }
  .price { font-family: system-ui, sans-serif; font-weight: 600; font-size: 19px; min-width: 90px; text-align: right; }
  .price.best { color: var(--brass-bright); }
  .calculator { background: var(--ink-soft); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  .calculator label { display:block; font-family:system-ui,sans-serif; font-size:13px; color:var(--paper-dim); margin-bottom:8px; }
  .calculator input { width:100%; background:var(--ink); color:var(--paper); border:1px solid var(--line); border-radius:8px; padding:12px 14px; font-size:18px; font-family:system-ui,sans-serif; }
  .calc-summary { margin-top:10px; font-family:system-ui,sans-serif; font-size:13px; color:var(--paper-dim); }
  .total { font-family:system-ui,sans-serif; font-weight:700; font-size:18px; color:var(--brass-bright); white-space:nowrap; }
  .meta { font-family: system-ui, sans-serif; font-size: 12px; color: var(--paper-dim); opacity: 0.55; margin-top: 18px; line-height: 1.6; }
  .pull { text-align: center; font-family: system-ui, sans-serif; font-size: 12px; color: var(--teal-bright); margin-bottom: 12px; }
  button#refresh {
    width: 100%; background: transparent; border: 1px solid var(--teal); color: var(--teal-bright);
    padding: 10px; border-radius: 8px; font-size: 13px; font-family: system-ui, sans-serif; margin-bottom: 16px;
  }
</style>
</head>
<body>
<header>
  <h1>Prix des Kamas</h1>
  <p class="sub">Mis a jour automatiquement en arriere-plan.</p>
</header>
<main>
  <button id="refresh">Rafraichir maintenant</button>
  <select id="server-select"></select>
  <div class="calculator">
    <label for="kamas-amount">Quantite de Kamas a vendre (en M)</label>
    <input id="kamas-amount" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Ex. 100">
    <div class="calc-summary" id="calc-summary">Entrez une quantite pour voir combien chaque site vous paierait.</div>
  </div>
  <div id="rows"></div>
  <div class="meta" id="meta">Chargement...</div>
</main>
<script>
function fmtDh(v) {
  if (v === null || v === undefined || !Number.isFinite(Number(v))) return "-";
  return Number(v).toFixed(2) + " DH";
}

function getKamasAmount() {
  const n = Number(document.getElementById("kamas-amount").value);
  return Number.isFinite(n) && n > 0 ? n : 0;
}

function updateCalculatorSummary(entries) {
  const amount = getKamasAmount();
  const el = document.getElementById("calc-summary");
  if (!amount) { el.textContent = "Entrez le nombre de M de Kamas (ex. 100 pour 100M)."; return; }
  const available = entries.filter(e => e.open === true && Number.isFinite(Number(e.price)));
  if (!available.length) { el.textContent = "Aucun site ouvert avec un prix disponible pour ce serveur."; return; }
  const best = available.reduce((a,b) => a.price > b.price ? a : b);
  el.textContent = `Pour ${amount.toLocaleString("fr-FR")}M Kamas, le meilleur paiement actuel est ${fmtDh(best.price * amount)} chez ${best.name}.`;
}

function fmt(v) {
  if (v === null || v === undefined || isNaN(v)) return "-";
  return Number(v).toFixed(3) + " DH/M";
}

let STATE = null;

function render() {
  if (!STATE) return;
  const select = document.getElementById("server-select");
  const server = select.value;
  const rowsEl = document.getElementById("rows");
  rowsEl.innerHTML = "";

  const siteIds = Object.keys(STATE.sites);
  const entries = siteIds.map((id) => {
    const entry = (STATE.data[id] || {})[server];
    return {
      id, name: STATE.sites[id].name, url: STATE.sites[id].url,
      price: entry ? entry.price : null, open: entry ? entry.open : null,
      total: entry ? entry.total : null,
    };
  });
  const openPrices = entries.filter((e) => e.open === true).map((e) => e.price);
  const maxOpen = openPrices.length ? Math.max(...openPrices) : null;

  const linkOnly = new Set(STATE.link_only_sites || []);

  entries.forEach((e) => {
    const hasData = e.price !== null && e.price !== undefined;
    const isBest = hasData && e.open === true && e.price === maxOpen;
    const a = document.createElement("a");
    a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.className = "row" + (isBest ? " best" : "") + (hasData && e.open === false ? " closed" : "");
    const badge = hasData
      ? `<span class="badge ${e.open === true ? "open" : e.open === false ? "closed" : "unknown"}">${e.open === true ? "Ouvert" : e.open === false ? "Stock complet" : "Stock à vérifier"}</span>`
      : "";
    let priceHtml;
    if (hasData) {
      const amount = getKamasAmount();
      const total = amount > 0 ? (e.price * amount) : null;
      priceHtml = `${badge}<span style="text-align:right"><span class="price${isBest ? " best" : ""}">${fmt(e.price)}</span>${total !== null ? `<br><span class="total">${fmtDh(total)}</span>` : ""}</span>`;
    } else if (linkOnly.has(e.id)) {
      priceHtml = `<span style="font-family:system-ui,sans-serif;font-size:13px;color:var(--paper-dim);opacity:.55">voir prix sur le site</span>`;
    } else {
      priceHtml = `<span style="font-family:system-ui,sans-serif;font-size:13px;color:var(--paper-dim);opacity:.55">pas de donnee</span>`;
    }
    a.innerHTML = `<span class="site-name">${e.name} \u2197</span><span style="display:flex;align-items:center;gap:10px">${priceHtml}</span>`;
    rowsEl.appendChild(a);
  });

  updateCalculatorSummary(entries);

  const metaEl = document.getElementById("meta");
  let metaText = "Derniere mise a jour : " + STATE.updated_at;
  const stale = STATE.stale_sites || [];
  if (stale.length) {
    const names = stale.map((id) => (STATE.sites[id] || {}).name || id).join(", ");
    metaText += ` — Attention : ${names} n'a pas pu etre verifie au dernier passage, prix precedent affiche.`;
  }
  metaEl.textContent = metaText;
}

const LAST_SERVER_KEY = "kamas-last-server";

function getSavedServer() {
  try { return localStorage.getItem(LAST_SERVER_KEY); } catch (e) { return null; }
}
function saveServer(name) {
  try { localStorage.setItem(LAST_SERVER_KEY, name); } catch (e) {}
}

async function loadPrices() {
  try {
    const res = await fetch("prices.json?t=" + Date.now());
    STATE = await res.json();
    const select = document.getElementById("server-select");
    if (!select.options.length) {
      const servers = new Set();
      Object.values(STATE.data).forEach((siteData) => Object.keys(siteData).forEach((s) => servers.add(s)));
      const sorted = [...servers].sort();
      sorted.forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        select.appendChild(opt);
      });
      const saved = getSavedServer();
      if (saved && sorted.includes(saved)) select.value = saved;
    }
    render();
  } catch (e) {
    document.getElementById("meta").textContent = "Impossible de charger prices.json pour le moment.";
  }
}

document.getElementById("server-select").addEventListener("change", (e) => {
  saveServer(e.target.value);
  render();
});
document.getElementById("refresh").addEventListener("click", loadPrices);
document.getElementById("kamas-amount").addEventListener("input", render);

loadPrices();
setInterval(loadPrices, 120000); // re-read prices.json every 2 min while the app is open

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
