<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prix des Kamas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1B1A17">
<style>
  :root {
    --ink: #1B1A17; --ink-soft: #242220; --paper: #F6F1E4; --paper-dim: #EAE2CC;
    --brass: #C89B3C; --brass-bright: #E3B94D; --teal: #3D6B66; --teal-bright: #5A9691;
    --line: #3A3730;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink); color: var(--paper); margin: 0;
    font-family: Georgia, 'Iowan Old Style', serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header { padding: 28px 20px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 24px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  .sub { margin: 6px 0 0; font-family: system-ui, sans-serif; font-size: 13px; color: var(--paper-dim); opacity: 0.7; }
  main { padding: 20px; max-width: 560px; margin: 0 auto; }
  select {
    width: 100%; background: var(--ink-soft); color: var(--paper);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    font-size: 16px; margin-bottom: 20px; font-family: system-ui, sans-serif;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--ink-soft); border: 1px solid var(--line); border-radius: 10px;
    padding: 15px 16px; margin-bottom: 10px; text-decoration: none; color: var(--paper);
  }
  .row.best { border-color: var(--brass); }
  .row.closed { opacity: 0.6; }
  .site-name { color: var(--teal-bright); font-family: system-ui, sans-serif; font-size: 14px; }
  .badge { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .badge.open { background: rgba(90,150,145,0.18); color: var(--teal-bright); }
  .badge.closed { background: rgba(165,71,58,0.18); color: #E8A79B; }
  .price { font-family: system-ui, sans-serif; font-weight: 600; font-size: 19px; min-width: 90px; text-align: right; }
  .price.best { color: var(--brass-bright); }
  .meta { font-family: system-ui, sans-serif; font-size: 12px; color: var(--paper-dim); opacity: 0.55; margin-top: 18px; line-height: 1.6; }
  .pull { text-align: center; font-family: system-ui, sans-serif; font-size: 12px; color: var(--teal-bright); margin-bottom: 12px; }
  button#refresh {
    width: 100%; background: transparent; border: 1px solid var(--teal); color: var(--teal-bright);
    padding: 10px; border-radius: 8px; font-size: 13px; font-family: system-ui, sans-serif; margin-bottom: 16px;
  }
</style>
</head>
<body>
<header>
  <h1>Prix des Kamas</h1>
  <p class="sub">Mis a jour automatiquement en arriere-plan.</p>
</header>
<main>
  <button id="refresh">Rafraichir maintenant</button>
  <select id="server-select"></select>
  <div id="rows"></div>
  <div class="meta" id="meta">Chargement...</div>
</main>
<script>
function fmt(v) {
  if (v === null || v === undefined || isNaN(v)) return "-";
  return Number(v).toFixed(3) + " DH/M";
}

let STATE = null;

function render() {
  if (!STATE) return;
  const select = document.getElementById("server-select");
  const server = select.value;
  const rowsEl = document.getElementById("rows");
  rowsEl.innerHTML = "";

  const siteIds = Object.keys(STATE.sites);
  const entries = siteIds.map((id) => {
    const entry = (STATE.data[id] || {})[server];
    return {
      id, name: STATE.sites[id].name, url: STATE.sites[id].url,
      price: entry ? entry.price : null, open: entry ? entry.open : null,
    };
  });
  const openPrices = entries.filter((e) => e.open).map((e) => e.price);
  const maxOpen = openPrices.length ? Math.max(...openPrices) : null;

  entries.forEach((e) => {
    const hasData = e.price !== null && e.price !== undefined;
    const isBest = hasData && e.open && e.price === maxOpen;
    const a = document.createElement("a");
    a.href = e.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.className = "row" + (isBest ? " best" : "") + (hasData && !e.open ? " closed" : "");
    const badge = hasData
      ? `<span class="badge ${e.open ? "open" : "closed"}">${e.open ? "Ouvert" : "Stock complet"}</span>`
      : "";
    const priceHtml = hasData
      ? `${badge}<span class="price${isBest ? " best" : ""}">${fmt(e.price)}</span>`
      : `<span style="font-family:system-ui,sans-serif;font-size:13px;color:var(--paper-dim);opacity:.55">pas de donnee</span>`;
    a.innerHTML = `<span class="site-name">${e.name} \u2197</span><span style="display:flex;align-items:center;gap:10px">${priceHtml}</span>`;
    rowsEl.appendChild(a);
  });

  document.getElementById("meta").textContent = "Derniere mise a jour : " + STATE.updated_at;
}

async function loadPrices() {
  try {
    const res = await fetch("prices.json?t=" + Date.now());
    STATE = await res.json();
    const select = document.getElementById("server-select");
    if (!select.options.length) {
      const servers = new Set();
      Object.values(STATE.data).forEach((siteData) => Object.keys(siteData).forEach((s) => servers.add(s)));
      [...servers].sort().forEach((s) => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        select.appendChild(opt);
      });
    }
    render();
  } catch (e) {
    document.getElementById("meta").textContent = "Impossible de charger prices.json pour le moment.";
  }
}

document.getElementById("server-select").addEventListener("change", render);
document.getElementById("refresh").addEventListener("click", loadPrices);

loadPrices();
setInterval(loadPrices, 120000); // re-read prices.json every 2 min while the app is open

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
